</style></head><body><div class="overlay" id="overlay" onclick="closeMenu()"></div><div class="app"><aside class="side" id="side"><div class="logo"><div class="logo-mark">✦</div>Tarih<span style="color:#2563eb">Hub</span></div><div class="side-label">ОҚУ ПЛАТФОРМАСЫ</div><div id="nav"></div><div class="side-bottom"><strong>📚 Оқу барысы</strong><div class="progress"><div id="sidebarProgress" style="width:0%"></div></div><p class="muted" id="sidebarText" style="font-size:12px;margin-bottom:0">0 / 10 бөлім</p></div></aside><main class="main"><header class="top"><div style="display:flex;gap:13px;align-items:center"><button class="menu-toggle" onclick="toggleMenu()" aria-label="Мәзір">☰</button><div class="crumb">Қазақстан тарихы <span style="margin:0 9px;color:#b4bdcb">/</span> <b id="crumb">Басты бет</b></div></div><div class="top-right"><span class="chip">10-сынып</span><div class="avatar">TH</div></div></header><div class="content" id="view"></div></main></div><div class="toast" id="toast" role="status"></div><script>const DATA={"lessons": [{"id": 1, "title": "Тоқырау кезеңі дегеніміз не?", "html": "<p>Тоқырау кезеңі – КСРО-да экономикалық даму қарқыны баяулап, саяси жүйе жаңармай, қоғамда әлеуметтік мәселелер көбейген тарихи кезең.</p>\n<p>1965–1985 жылдары Қазақстан КСРО құрамында болды. Сондықтан республика экономикасы мен саясаты Мәскеудегі орталық билікке тәуелді еді.</p>\n<p>Негізгі ерекшелігі: 1965 жылғы реформалар бастапқыда жақсы нәтиже берді, бірақ 1970-жылдары олар тоқтатылып, экономикалық және саяси мәселелер күшейді.</p>\n<p>Оқиғалардың даму тізбегі</p>\n<p>1965 жыл — реформалардың басталуы</p>\n<p>Кәсіпорындарға дербестік берілді</p>\n<p>1966–1970 жылдар — экономикалық өсу</p>\n<p>VIII бесжылдық «алтын бесжылдық» аталды</p>\n<p>1970-жылдар — реформалардың тоқтатылуы</p>\n<p>Орталықтандырылған басқару сақталды</p>\n<p>1970–1980-жылдар — тоқыраудың күшеюі</p>\n<p>Өнімділік төмендеп, тапшылық пен тиімсіздік артты</p>\n", "summary": "Тоқырау кезеңі – КСРО-да экономикалық даму қарқыны баяулап, саяси жүйе жаңармай, қоғамда әлеуметтік мәселелер көбейген тарихи кезең."}, {"id": 2, "title": "Саяси жағдай", "html": "<p>1964 жылы қазанда Леонид Брежнев КОКП Орталық Комитетінің Бірінші хатшысы болды, ал Алексей Косыгин КСРО үкіметін басқарды.</p>\n<p>Daftar Pemimpin Uni Soviet 1917-1991 - Catatan Adi</p>\n<p>Л. И. Брежнев</p>\n<p>КСРО-ның саяси басшысы. Оның билігі кезінде Коммунистік партияның үстемдігі және орталықтандырылған басқару жүйесі сақталды.</p>\n<p>18 декабря 1980 года не стало Алексея Николаевича Косыгина - Мы из Советского Союза - Медиаплатформа МирТесен</p>\n<p>А. Н. Косыгин</p>\n<p>1965 жылғы экономикалық реформалардың негізгі бастамашыларының бірі. Кәсіпорындарға дербестік беріп, өндіріс тиімділігін арттыруды көздеді.</p>\n<h3>Саясаттың оң және теріс жақтары</h3>\n<table>\n<thead>\n<tr>\n  <th>Оң жақтары</th>\n  <th>Теріс жақтары</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1965 жылы басқару жүйесін жаңарту басталды.</td>\n  <td>Коммунистік партияның билігі сақталды.</td>\n</tr>\n<tr>\n  <td>Кәсіпорындарға белгілі бір дербестік берілді.</td>\n  <td>Министрліктердің әкімшілік бақылауы күшейді.</td>\n</tr>\n<tr>\n  <td>Өндірісті ғылыми негізде басқаруға ұмтылыс жасалды.</td>\n  <td>Негізгі шешімдер орталықта қабылданды.</td>\n</tr>\n<tr>\n  <td></td>\n  <td>Бюрократия мен қағазбастылық көбейді.</td>\n</tr>\n<tr>\n  <td></td>\n  <td>Жаңашыл реформаларға қарсылық болды.</td>\n</tr>\n</tbody>\n</table>\n<p>Неліктен саяси жүйе реформаларға кедергі жасады?</p>\n<p>1968 жылғы «Прага көктемі» кезінде Чехословакияда социалистік жүйені демократияландыру әрекеттері болды. Кеңестік басшылық мұндай өзгерістерден қауіптеніп, экономикалық дербестікті одан әрі кеңейтуді қолдамады.</p>\n<p>Қорытынды: басшылық экономиканы жаңартқысы келді, бірақ саяси билікті орталықтан босатқысы келмеді. Бұл реформалардың толық жүзеге асуына кедергі болды.&amp;#x20;</p>\n", "summary": "1964 жылы қазанда Леонид Брежнев КОКП Орталық Комитетінің Бірінші хатшысы болды, ал Алексей Косыгин КСРО үкіметін басқарды."}, {"id": 3, "title": "Экономикалық жағдай", "html": "<h3>3.1. 1965 жылғы Косыгин реформасы</h3>\n<p>Мақсаты: кәсіпорындардың тиімділігін арттыру, өнім сапасын жақсарту, жұмысшыларды нәтижелі еңбекке ынталандыру.</p>\n<p>Реформаға дейін кәсіпорындар негізінен мемлекет бекіткен жоспарды орындауға бағытталды. Өнімнің сапасы мен табыстылығы әрдайым басты көрсеткіш болмады.</p>\n<p>1965 жылы өнеркәсіпті басқару жүйесін өзгерту туралы шешім қабылданды.</p>\n<table>\n<thead>\n<tr>\n  <th>Не өзгерді?</th>\n  <th>Қалай жүзеге асты?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Кәсіпорындардың дербестігі</td>\n  <td>Өндірісті жоспарлауға көбірек мүмкіндік берілді.</td>\n</tr>\n<tr>\n  <td>Шаруашылық есеп</td>\n  <td>Кіріс пен шығысты салыстырып, ресурстарды үнемдеу талап етілді.</td>\n</tr>\n<tr>\n  <td>Материалдық ынталандыру</td>\n  <td>Жақсы жұмыс істеген қызметкерлер сыйақы алды.</td>\n</tr>\n<tr>\n  <td>Пайда мен рентабельділік</td>\n  <td>Өндірістің тек көлемі емес, табыстылығы да есепке алынды.</td>\n</tr>\n<tr>\n  <td>Ғылыми-техникалық прогресс</td>\n  <td>Жаңа технологияларды өндіріске енгізу көзделді.</td>\n</tr>\n</tbody>\n</table>\n<p>Нәтижесі: еңбек өнімділігі артып, өндіріс қарқынды дамыды.</p>\n<h3>3.2. VIII бесжылдық (1966–1970)</h3>\n<p>Бұл кезең «алтын бесжылдық» деп аталды. Себебі экономикалық өсім жоғары болды.</p>\n<h1>+42%</h1>\n<p>КСРО ұлттық табысының өсімі</p>\n<h1>1,5 есе</h1>\n<p>КСРО өнеркәсіп өндірісінің өсімі</p>\n<h1>2,4 есе</h1>\n<p>Қазақстан химия өнеркәсібінің өсуі</p>\n<h1>1,6 есе</h1>\n<p>Қазақстан машина жасау саласының өсуі</p>\n<p>Оқулықта берілген өндірістік көрсеткіштер.&amp;#x20;</p>\n<h3>3.3. Қазақстан өнеркәсібінің жетістіктері</h3>\n<table>\n<thead>\n<tr>\n  <th>Сала</th>\n  <th>Нақты факт</th>\n  <th>Маңызы</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Машина жасау</td>\n  <td>1966 жылы Павлодар трактор зауыты құрылды.</td>\n  <td>Ауыл шаруашылығы техникаларын өндіру дамыды.</td>\n</tr>\n<tr>\n  <td>Мұнай</td>\n  <td>1965 жылы Жаңаөзен кен орнында алғашқы мұнай өндірілді.</td>\n  <td>Мұнай өнеркәсібі кеңейді.</td>\n</tr>\n<tr>\n  <td>Энергетика</td>\n  <td>Қарағанды 2-ГРЭС пен Бұқтырма СЭС іске қосылды.</td>\n  <td>Электр энергиясын өндіру артты.</td>\n</tr>\n<tr>\n  <td>Электрлендіру</td>\n  <td>1970 жылы 34,6 млрд кВт·сағ-тан астам электр өндірілді.</td>\n  <td>Өнеркәсіпті электрмен жабдықтау жақсарды.</td>\n</tr>\n<tr>\n  <td>Көмір</td>\n  <td>Екібастұзда көмірді ашық әдіспен өндіру дамыды.</td>\n  <td>Ірі техника пайдаланылып, өндіру көлемі ұлғайды.</td>\n</tr>\n<tr>\n  <td>Жеңіл өнеркәсіп</td>\n  <td>Семей кабель зауыты, тоқыма кәсіпорындары жұмыс істеді.</td>\n  <td>Өнеркәсіптің жаңа бағыттары қалыптасты.</td>\n</tr>\n</tbody>\n</table>\n<p>История одного памятника: 200-тысячный трактор - PavlodarNews.kz - Новости Павлодарской области</p>\n<p>About the company - SUSTAINABLE DEVELOPMENT REPORT 2022</p>\n<p>Bukhtarminskaya HPP - Visit East Qazaqstan</p>\n<h3>3.4. Экономикадағы қарама-қайшылықтар</h3>\n<p>1970-жылдары өнеркәсіпті дамытуға 40 млрд сомнан астам қаржы бөлінгенімен, экономикалық тиімділік жеткіліксіз болды.</p>\n<table>\n<thead>\n<tr>\n  <th>Мәселе</th>\n  <th>Себебі және салдары</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Шикізаттық бағыт</td>\n  <td>Қазақстан көбіне шикізат өндіруге маманданды. Дайын өнім жасаудың мүмкіндігі шектелді.</td>\n</tr>\n<tr>\n  <td>Орталыққа тәуелділік</td>\n  <td>Ресурстарды пайдалануды одақтық министрліктер басқарды.</td>\n</tr>\n<tr>\n  <td>Жоспарлы экономика</td>\n  <td>Өндіріс нақты сұранысқа емес, жоспар көрсеткіштеріне бағытталды.</td>\n</tr>\n<tr>\n  <td>Ресурстарды ысырап ету</td>\n  <td>Қаржы, энергия мен шикізат тиімсіз жұмсалды.</td>\n</tr>\n<tr>\n  <td>Техникалық артта қалу</td>\n  <td>Ғылыми жаңалықтарды өндіріске енгізу баяу жүрді.</td>\n</tr>\n<tr>\n  <td>Қосып жазу</td>\n  <td>Кәсіпорындар жоспар орындалды деп жалған көрсеткіштер ұсынды.</td>\n</tr>\n<tr>\n  <td>Тауар сапасының төмендігі</td>\n  <td>Кейбір өнімдер сапасыз болып, қоймаларда сатылмай қалды.</td>\n</tr>\n</tbody>\n</table>\n<p>Нақты мысал: оқулықтағы дерек бойынша Орталық Қазақстан кәсіпорындарынан орталық жыл сайын шамамен 15 млрд сом табыс алғанымен, республикалық бюджетке 31 млн сом ғана бөлінген. Бұл Қазақстан ресурстарын пайдаланудағы теңсіздікті көрсетеді.</p>\n<p>Негізгі мәселе: өндіріс орындарының саны көбейді, бірақ олардың тиімділігі сәйкес деңгейде артпады.&amp;#x20;</p>\n", "summary": "Мақсаты: кәсіпорындардың тиімділігін арттыру, өнім сапасын жақсарту, жұмысшыларды нәтижелі еңбекке ынталандыру."}, {"id": 4, "title": "Ауыл шаруашылығы", "html": "<h3>4.1. Ауыл шаруашылығын дамыту шаралары</h3>\n<p>1965 жылғы наурыз пленумы ауыл шаруашылығының жағдайын жақсартуға бағытталды.</p>\n<p>1967 жылы сәуірде совхоздарды толық шаруашылық есепке көшіру туралы қаулы қабылданды.</p>\n<p>Реформалар нәтижесінде механикаландыру, электрлендіру, қаржыландыру және еңбекке ақы төлеу жүйесін жетілдіру көзделді.</p>\n<h3>Жетістіктері мен кемшіліктері</h3>\n<table>\n<thead>\n<tr>\n  <th>Оң нәтижелер</th>\n  <th>Теріс нәтижелер</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1971–1978 жылдары ауыл шаруашылығына 58,2 млрд сом бөлінді.</td>\n  <td>Орталықтан басқару сақталды.</td>\n</tr>\n<tr>\n  <td>Ауыл шаруашылық жұмыстарының 75–90%-ы техникамен қамтамасыз етілді.</td>\n  <td>Жоспарлау қателіктері жалғасты.</td>\n</tr>\n<tr>\n  <td>Кейбір шаруашылықтар өз табысының бөлігін өздері жұмсауға мүмкіндік алды.</td>\n  <td>Озық тәжірибелер кең таралмады.</td>\n</tr>\n<tr>\n  <td>Ет, сүт, жұмыртқа және астықтың өзіндік құны төмендеді.</td>\n  <td>Реформалар толық аяқталмады.</td>\n</tr>\n</tbody>\n</table>\n<h3>Колхоздар мен совхоздардың өзгеруі</h3>\n<table>\n<thead>\n<tr>\n  <th>Жыл</th>\n  <th>Совхоз саны</th>\n  <th>Колхоз саны</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1960</td>\n  <td>879</td>\n  <td>1355</td>\n</tr>\n<tr>\n  <td>1985</td>\n  <td>2140</td>\n  <td>388</td>\n</tr>\n</tbody>\n</table>\n<p>Себебі: ұжымшарлардың бір бөлігі мемлекеттік кеңшарларға айналдырылды, сондықтан совхоздар саны өсті.</p>\n<p>Совхоз — мемлекеттік ауыл шаруашылық кәсіпорны. Колхоз — ұжымдық шаруашылық.</p>\n<p>Қарама-қайшылық: КСРО ауыл шаруашылығына көп қаржы бөлсе де, азық-түлік тапшылығын толық шеше алмады. Оқулық бойынша 1981–1985 жылдары КСРО жыл сайын шетелден шамамен 3,8 млрд долларға азық-түлік сатып алды.&amp;#x20;</p>\n", "summary": "1965 жылғы наурыз пленумы ауыл шаруашылығының жағдайын жақсартуға бағытталды."}, {"id": 5, "title": "И. Худенко және «Ақши» тәжірибесі", "html": "<p>Д.А.Кунаев</p>\n<p>Иван Худенко — шаруашылықты басқарудың жаңа әдісін енгізуге тырысқан жаңашыл басшы.</p>\n<p>Алматы облысы Күрті ауданындағы «Ақши» совхозында фермерлік тәсілге ұқсас басқару жүйесін қолданды.</p>\n<h3>Не өзгертті?</h3>\n<ul>\n<li>Қағазбастылықты азайтты.</li>\n<li>Жұмысшыларға көбірек еркіндік берді.</li>\n<li>Маңызды мәселелерді шаруашылық кеңесінде талқылады.</li>\n<li>Еңбек нәтижесіне қарай ақы төлеуді күшейтті.</li>\n<li>Мал азығын жақсартып, өндіріс тиімділігін арттырды.</li>\n</ul>\n<h2>6 есе</h2>\n<p>Еңбек өнімділігі жоғары</p>\n<h2>2–3 есе</h2>\n<p>Жалақы жоғары</p>\n<h2>30–40%</h2>\n<p>Сүт өнімділігі артты</p>\n<h3>Неліктен тәжірибе тоқтатылды?</h3>\n<p>1970 жылы билік Худенконың тәсілін «социализмге жат» деп танып, шаруашылықты жапты. Худенко сотталып, 1974 жылы түрмеде қайтыс болды.</p>\n<p>Тарихи маңызы: «Ақши» тәжірибесі дербестік пен материалдық ынталандыру еңбек өнімділігін арттыра алатынын көрсетті. Бірақ кеңестік билік мұндай жаңашылдықты қолдамады.&amp;#x20;</p>\n", "summary": "Д.А.Кунаев"}, {"id": 6, "title": "Әлеуметтік жағдай", "html": "<p>Әлеуметтік салада да қарама-қайшылықтар болды. Кейбір жұмысшылардың жалақысы көтеріліп, еңбек жағдайын жақсартуға көңіл бөлінсе де, күнделікті тұрмыстағы мәселелер сақталды.</p>\n<table>\n<thead>\n<tr>\n  <th>Оң өзгерістер</th>\n  <th>Теріс өзгерістер</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Еңбекақы мен сыйақылар көбейді.</td>\n  <td>Жалақының өсуі еңбек өнімділігінен озып кетті.</td>\n</tr>\n<tr>\n  <td>Социалистік жарыстар ұйымдастырылды.</td>\n  <td>Жоспарды орындау үшін жалған есеп беру таралды.</td>\n</tr>\n<tr>\n  <td>Жұмысшылардың еңбек жағдайын жақсарту шаралары қолға алынды.</td>\n  <td>Халық тұтынатын тауарлардың сапасы мен қолжетімділігі жеткіліксіз болды.</td>\n</tr>\n<tr>\n  <td>Кәсіпорындарда тұрмыстық тазалыққа көңіл бөлінді.</td>\n  <td>Қоғамның нақты қажеттіліктері екінші орынға ысырылды.</td>\n</tr>\n</tbody>\n</table>\n<p>Нақты фактілер:</p>\n<p>1966 жылы Шымкент пресс-автомат зауытында өнімді аз шығынмен шығару бастамасы көтерілді. Ал 1970-жылдары Орталық Қазақстандағы 170 еңбек ұжымы жоспардан тыс 100 млн сомның өнімін шығарды.</p>\n<p>1968 жылы Қарағанды машина жасау зауыты өндірістік этика мен еңбек орнындағы тазалықты бақылауды қолға алды.</p>\n<p>Алайда жалақы мен сыйақылардың өсуі барлық мәселені шешкен жоқ. Сапалы күнделікті тұтыну тауарларының жеткіліксіздігі халықтың тұрмысына кері әсер етті.</p>\n", "summary": "Әлеуметтік салада да қарама-қайшылықтар болды. Кейбір жұмысшылардың жалақысы көтеріліп, еңбек жағдайын жақсартуға көңіл бөлінсе де, күнделікті тұрмыстағы мәселелер сақталды."}, {"id": 7, "title": "Косыгин реформасы неліктен сәтсіз аяқталды?", "html": "<table>\n<thead>\n<tr>\n  <th>Себеп</th>\n  <th>Түсіндіру</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Саяси</td>\n  <td>Билік кәсіпорындарға толық еркіндік беруге дайын болмады.</td>\n</tr>\n<tr>\n  <td>Экономикалық</td>\n  <td>Орталықтандырылған жоспарлау мен мемлекеттік бақылау сақталды.</td>\n</tr>\n<tr>\n  <td>Әкімшілік</td>\n  <td>Министрліктер кәсіпорындардың ісіне араласуын жалғастырды.</td>\n</tr>\n<tr>\n  <td>Идеологиялық</td>\n  <td>Нарықтық тәсілдер социалистік жүйеге қайшы деп қабылданды.</td>\n</tr>\n<tr>\n  <td>Қаржылық</td>\n  <td>Баға мен жалақы өсімі өндіріс тиімділігінен озып кетті.</td>\n</tr>\n<tr>\n  <td>Шикізаттық</td>\n  <td>Мұнай мен басқа ресурстардан алынған табыс реформаны жалғастыру қажеттілігін әлсіретті.</td>\n</tr>\n</tbody>\n</table>\n<p>Себеп-салдар байланысы:</p>\n<p>Реформалардың жартылай жүргізілуі → кәсіпорындардың дербестігінің шектелуі → еңбек өнімділігінің баяулауы → ресурстардың тиімсіз жұмсалуы → экономикалық тоқырау.</p>\n", "summary": "Себеп-салдар байланысы:"}, {"id": 8, "title": "Маңызды жылдар мен оқиғалар", "html": "<table>\n<thead>\n<tr>\n  <th>Жыл</th>\n  <th>Оқиға</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>1962</td>\n  <td>Е. Либерманның «Жоспар, пайда, сыйақы» мақаласы жарияланды.</td>\n</tr>\n<tr>\n  <td>1964</td>\n  <td>Л. Брежнев билікке келіп, А. Косыгин үкімет басшысы болды.</td>\n</tr>\n<tr>\n  <td>1965</td>\n  <td>Косыгин реформасы басталды.</td>\n</tr>\n<tr>\n  <td>1965</td>\n  <td>Наурыз пленумы ауыл шаруашылығын дамыту шараларын қабылдады.</td>\n</tr>\n<tr>\n  <td>1965</td>\n  <td>Жаңаөзен кен орнында мұнай өндіріле бастады.</td>\n</tr>\n<tr>\n  <td>1966–1970</td>\n  <td>VIII «алтын бесжылдық».</td>\n</tr>\n<tr>\n  <td>1966</td>\n  <td>Павлодар трактор зауыты құрылды.</td>\n</tr>\n<tr>\n  <td>1967</td>\n  <td>Совхоздарды шаруашылық есепке көшіру туралы қаулы қабылданды.</td>\n</tr>\n<tr>\n  <td>1968</td>\n  <td>Прага көктемі кеңестік басшылықтың реформалардан қауіптенуін күшейтті.</td>\n</tr>\n<tr>\n  <td>1969</td>\n  <td>И. Худенконың «Ақши» тәжірибесі жоғары нәтиже көрсетті.</td>\n</tr>\n<tr>\n  <td>1970</td>\n  <td>«Ақши» шаруашылығы жабылды.</td>\n</tr>\n<tr>\n  <td>1970-жылдар</td>\n  <td>Экономикалық реформалар тоқтатылды.</td>\n</tr>\n<tr>\n  <td>1974</td>\n  <td>И. Худенко түрмеде қайтыс болды.</td>\n</tr>\n<tr>\n  <td>1981–1985</td>\n  <td>КСРО азық-түлікті көп мөлшерде шетелден сатып алды.</td>\n</tr>\n</tbody>\n</table>\n", "summary": ""}, {"id": 9, "title": "Негізгі ұғымдар", "html": "<table>\n<thead>\n<tr>\n  <th>Термин</th>\n  <th>Анықтамасы</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>Тоқырау</td>\n  <td>Экономикалық, саяси және әлеуметтік дамудың баяулауы.</td>\n</tr>\n<tr>\n  <td>Жоспарлы экономика</td>\n  <td>Өндіріс көлемі мен ресурстарды бөлуді мемлекет анықтайтын жүйе.</td>\n</tr>\n<tr>\n  <td>Шаруашылық есеп</td>\n  <td>Кәсіпорынның кірісі мен шығысын есептеп, тиімді жұмыс істеуге ұмтылуы.</td>\n</tr>\n<tr>\n  <td>Рентабельділік</td>\n  <td>Кәсіпорын қызметінің қаншалықты табысты екенін көрсететін көрсеткіш.</td>\n</tr>\n<tr>\n  <td>Социалистік жарыс</td>\n  <td>Жұмысшылар мен ұжымдардың жоспарды орындау және өнімділікті арттыру үшін ұйымдастырылған бәсекесі.</td>\n</tr>\n<tr>\n  <td>Экстенсивті даму</td>\n  <td>Өндірісті жаңа ресурстар, жұмыс күші мен кәсіпорындар санын көбейту арқылы өсіру.</td>\n</tr>\n<tr>\n  <td>Интенсивті даму</td>\n  <td>Өндірісті жаңа технология мен еңбек өнімділігін арттыру арқылы өсіру.</td>\n</tr>\n<tr>\n  <td>Бюрократия</td>\n  <td>Басқаруда артық әкімшілік рәсімдер мен қағазбастылықтың басым болуы.</td>\n</tr>\n<tr>\n  <td>Қосып жазу</td>\n  <td>Орындалмаған жұмысты есепте орындалды деп көрсету.</td>\n</tr>\n</tbody>\n</table>\n", "summary": ""}, {"id": 10, "title": "Жалпы қорытынды", "html": "<p>1965–1985 жылдар «тоқырау кезеңі» деп аталды, себебі кеңестік жоспарлы экономика мен орталықтандырылған саяси жүйе қоғамның дамуын тежеді.</p>\n<p>1965 жылғы Косыгин реформасы кәсіпорындарға дербестік беріп, өндіріс тиімділігін арттыруды көздеді. Алғашқы нәтижелері жақсы болды: 1966–1970 жылдар «алтын бесжылдық» аталып, өнеркәсіп пен ауыл шаруашылығы дамыды.</p>\n<p>Алайда саяси билік реформаларды толық жүзеге асыруға мүмкіндік бермеді. Кәсіпорындар орталыққа тәуелді болып қалды, ресурстар тиімсіз жұмсалды, жаңа технологиялар баяу енгізілді. И. Худенконың «Ақши» тәжірибесінің тоқтатылуы осы жағдайдың нақты мысалы болды.</p>\n<p>Демек, тоқыраудың басты себебі — экономиканы жаңарту әрекеттері мен ескі саяси-басқару жүйесінің арасындағы қайшылық.</p>\n", "summary": "1965–1985 жылдар «тоқырау кезеңі» деп аталды, себебі кеңестік жоспарлы экономика мен орталықтандырылған саяси жүйе қоғамның дамуын тежеді."}], "questions": [["1965 жылғы Косыгин реформасының негізгі мақсаты қандай?", ["Кәсіпорындарды жабу", "Өндіріс тиімділігі мен дербестігін арттыру", "Жеке меншікті толық енгізу"], 1, "Реформа шаруашылық есеп пен ынталандыру арқылы тиімділікті арттыруды көздеді.", 3], ["VIII бесжылдық неге «алтын бесжылдық» аталды?", ["Жоғары экономикалық өсімге байланысты", "Барлық кәсіпорындар жекешелендірілді", "Мұнай өндірісі тоқтады"], 0, "1966–1970 жылдары өндіріс пен ұлттық табыс қарқынды өсті.", 3], ["И. Худенко тәжірибесі нені көрсетті?", ["Қағазбастылық пайдалы екенін", "Жаңа техника пайдасыз екенін", "Дербестік пен ынталандыру өнімділікті арттыра алатынын"], 2, "«Ақши» тәжірибесі еңбек ұйымдастырудың жаңа тәсілдерін көрсетті.", 5], ["Реформалардың сәтсіз аяқталуының басты себебі?", ["Орталықтандырылған басқарудың сақталуы", "Қазақстанда табиғи ресурс болмады", "Барлық зауыттар жабылды"], 0, "Саяси-әкімшілік жүйе кәсіпорын дербестігін шектеді.", 7], ["Экстенсивті дамуға қай мысал сәйкес?", ["Техника тиімділігін арттыру", "Жаңа кен орындарын ашу", "Қалдықты азайту"], 1, "Экстенсивті өсу ресурстар мен өндіріс көлемін көбейтуге сүйенеді.", 9], ["1964 жылы КОКП басшылығына кім келді?", ["Алексей Косыгин", "Леонид Брежнев", "Иван Худенко"], 1, "1964 жылы қазанда Л. Брежнев КОКП ОК бірінші хатшысы болды.", 2], ["1968 жылғы қай оқиға кеңестік биліктің реформалардан қауіптенуін күшейтті?", ["Прага көктемі", "Алтын бесжылдық", "Ақши тәжірибесі"], 0, "Прага көктемі кезінде социалистік жүйені демократияландыру әрекеттері болды.", 2], ["Қазақстанның химия өнеркәсібі VIII бесжылдықта қанша есе өсті?", ["1,2 есе", "2,4 есе", "6 есе"], 1, "Берілген конспект бойынша химия өнеркәсібі 2,4 есе өсті.", 3], ["Павлодар трактор зауыты қай жылы құрылды?", ["1966", "1974", "1985"], 0, "Конспектте 1966 жыл көрсетілген.", 3], ["1970 жылы электр энергиясын өндіру қанша болды?", ["3,8 млрд кВт·сағ", "34,6 млрд кВт·сағ-тан астам", "100 млн кВт·сағ"], 1, "Конспект бойынша 1970 жылы 34,6 млрд кВт· const tf=[['1965 жылғы реформалар кәсіпорын дербестігін арттыруды көздеді.',true,'Реформалар дербестік пен материалдық ынталандыруды кеңейтуді мақсат етті.'],['VIII бесжылдық 1981–1985 жылдары өтті.',false,'VIII бесжылдық 1966–1970 жылдары болды.'],['Косыгин реформасы толық іске асырылды.',false,'Орталықтан басқару сақталып, реформалар шектелді.'],['Павлодар трактор зауыты 1966 жылы құрылды.',true,'Бұл дерек берілген конспектте көрсетілген.'],['Қазақстан экономикасы Мәскеуге тәуелсіз болды.',false,'Қазақстан КСРО құрамында болып, орталыққа тәуелді болды.'],['«Ақши» тәжірибесі қағазбастылықты азайтты.',true,'Худенко басқаруды жеңілдетуге тырысты.'],['«Ақши» тәжірибесі 1970 жылы жабылды.',true,'Конспект бойынша 1970 жылы жабылған.'],['Совхоз мемлекеттік шаруашылық болды.',true,'Совхоз — мемлекеттік ауыл шаруашылық кәсіпорны.'],['Экстенсивті даму жаңа технологиямен ғана байланысты.',false,'Экстенсивті даму ресурстар мен өндіріс ауқымын көбейтеді.'],['Тоқырау кезеңінде ешқандай өнеркәсіп дамымады.',false,'Өнеркәсіп дамыды, бірақ оның тиімділігі мен құрылымында қайшылықтар болды.']];let tfAnswers={},tfChecked=false;function renderTF(){$('practiceBody').innerHTML=`${tf.map(([q,a,why],i)=>`<div class="card question"><h3>${i+1}. ${esc(q)}</h3><div class="tabs" style="margin:0">${[[true,'Дұрыс'],[false,'Бұрыс']].map(([v,t])=>`<button class="${tfAnswers[i]===v?'active':''}" onclick="tfAnswers[${i}]=${v};tfChecked=false;renderTF()">${t}</button>`).join('')}</div>${tfChecked?`<div class="feedback">${tfAnswers[i]===a?'✓ Дұрыс!':'✕ Қате.'} ${esc(why)}</div>`:''}</div>`).join('')}<button class="btn primary" onclick="checkTF()">Тексеру →</button>${tfChecked?`<b style="margin-left:15px">${tf.filter((x,i)=>tfAnswers[i]===x[1]).length} / ${tf.length}</b>`:''}`}
function checkTF(){if(Object.keys(tfAnswers).length<tf.length){toast('Барлық тұжырымға жауап беріңіз');return}tfChecked=true;let n=tf.filter((x,i)=>tfAnswers[i]===x[1]).length;state.scores.push({type:'Дұрыс/Бұрыс',score:n,max:tf.length,date:new Date().toLocaleDateString('kk-KZ')});save();renderTF();toast('Нәтиже сақталды')}
const essays=['1965–1985 жылдар не себепті «тоқырау кезеңі» деп аталды? Өз пікіріңізді нақты тарихи фактілермен дәлелдеңіз.','Косыгин реформалары неліктен толық жүзеге аспады?','И. Худенконың «Ақши» тәжірибесі кеңестік экономиканың қандай қайшылықтарын көрсетті?','Қазақстан өнеркәсібінің дамуы республика үшін пайдалы болды ма?'];const erub=[['Тарихи дәлдік',3],['Нақты фактілер мен дәлелдер',3],['Себеп-салдарлық талдау',2],['Құрылым және қорытынды',2]];function renderEssay(){let key='e'+essayIndex,body=state.essays[key]||'',rub=state.essayRubrics[key]||{};$('view').innerHTML=`${heading('Ой толғау','Тарихи көзқарасыңызды дәлелдермен қорғаңыз. Бағалау — өзіңіз жүргізетін рубрика, AI қолданылмайды.')}<div class="grid two" style="grid-template-columns:minmax(0,1.6fr) minmax(270px,1fr)"><div class="card"><label class="label" for="essaySelect">Тақырыпты таңдаңыз</label><select class="field" id="essaySelect" onchange="essayIndex=Number(this.value);renderEssay()">${essays.map((x,i)=>`<option value="${i}" ${essayIndex===i?'selected':''}>${esc(x)}</option>`).join('')}</select><h3 style="line-height:1.7">${esc(essays[essayIndex])}</h3><textarea class="field editor" id="essayText" placeholder="Тезисіңізді жазыңыз. Нақты деректермен дәлелдеңіз..." oninput="state.essays['${key}']=this.value;save();updateWords()">${esc(body)}</textarea><div class="lesson-actions"><span class="muted" id="wordCount"></span><button class="btn primary" onclick="save();toast('Жауап сақталды')">Жауапты сақтау ✓</button></div></div><div><div class="card"><div class="eyebrow">ЖАЗУ ЖОСПАРЫ</div><h3>Жауап құрылымы</h3><p class="muted">01 · Тезис: өз пікіріңіз</p><p class="muted">02 · Бірінші тарихи дәлел</p><p class="muted">03 · Нақты дата немесе факт</p><p class="muted">04 · Екінші дәлел</p><p class="muted">05 · Себеп-салдарлық талдау</p><p class="muted">06 · Қорытынды</p></div><div class="card" style="margin-top:16px"><div class="eyebrow">ӨЗІН-ӨЗІ БАҒАЛАУ</div><h3>Критерийлер · 10 балл</h3>${erub.map(([name,max],i)=>`<div class="rubric"><div><b>${esc(name)}</b><div class="stat-note">Максимум ${max} балл</div></div><select onchange="setEssayRubric('${key}',${i},this.value)">${Array.from({length:max+1},(_,n)=>`<option value="${n}" ${Number(rub[i]||0)===n?'selected':''}>${n} / ${max}</option>`).join('')}</select></div>`).join('')}<div class="stat-number" id="essayTotal">${erub.reduce((s,_,i)=>s+Number(rub[i]||0),0)} / 10</div><p class="stat-note">Бұл — өзін-өзі бағалау, мұғалімнің ресми бағасы емес.</p></div></div></div>${footer()}`;updateWords()}
function updateWords(){let el=$('essayText');if(el)$('wordCount').textContent=`${el.value.trim()?el.value.trim().split(/\s+/).length:0} сөз`};function setEssayRubric(k,i,v){state.essayRubrics[k]??={};state.essayRubrics[k][i]=Number(v);save();$('essayTotal').textContent=erub.reduce((s,_,j)=>s+Number(state.essayRubrics[k][j]||0),0)+' / 10'}
const ravens=[['R','Reputation','Дереккөздің беделі','Дереккөзді кім жариялады? Оның сенімділігі туралы не белгілі?',2],['A','Ability to Observe','Бақылау мүмкіндігі','Автор оқиғаға қаншалықты жақын болды? Нені тікелей көрді?',2],['V','Vested Interest','Жеке мүдде','Автордың пайдасы, мүддесі немесе саяси мақсаты бар ма?',3],['E','Expertise','Біліктілік','Автор осы мәселе бойынша қаншалықты білімді?',2],['N','Neutrality','Бейтараптық','Материал біржақты ма? Балама көзқарастар бар ма?',3]];const sources=[['1965 жылғы экономикалық реформа','Оқу конспектінің мазмұндық мазмұндамасы: 1965 жылғы реформа кәсіпорындардың дербестігін, шаруашылық есепті және материалдық ынталандыруды кеңейтуді көздеді. Бірақ орталықтандырылған басқару сақталды.'],['Қазақстан өнеркәсібінің дамуы','Оқу конспектінің мазмұндық мазмұндамасы: 1966–1970 жылдары өнеркәсіп өсті. Павлодар трактор зауыты, Жаңаөзен мұнайы, Екібастұз көмірі сияқты бағыттар дамыды. Алайда шикізаттық тәуелділік пен тиімділік мәселелері сақталды.'],['И. Худенко және «Ақши»','Оқу конспектінің мазмұндық мазмұндамасы: Худенко «Ақши» шаруашылығында басқаруды жеңілдетіп, еңбекке ынталандыру енгізді. Конспектте өнімділіктің жоғарылағаны және тәжірибенің 1970 жылы жабылғаны айтылған.']];function renderRaven(){let k='r'+ravenIndex,rub=state.ravenRubrics[k]||{};$('view').innerHTML=`${heading('RAVEN талдауы','Тарихи дереккөзді бес өлшем бойынша сыни бағалаңыз. Берілген үзінділер — түпнұсқа емес, оқу мазмұндамалары.')}<div class="card" style="margin-bottom:19px"><label class="label">Талдауға арналған материал</label><select class="field" onchange="ravenIndex=Number(this.value);renderRaven()">${sources.map(([t],i)=>`<option value="${i}" ${ravenIndex===i?'selected':''}>${esc(t)}</option>`).join('')}</select><h3>${esc(sources[ravenIndex][0])}</h3><div class="highlight-box"><strong>Оқу мазмұндамасы · Түпнұсқа тарихи құжат емес</strong><p>${esc(sources[ravenIndex][1])}</p></div><p class="muted">Автор мен түпнұсқаның жарияланған жері көрсетілмеген. Сондықтан дереккөз беделін бағалағанда ақпараттың шектеулі екенін атап өтіңіз.</p></div>${ravens.map(([letter,en,kk,hint,max],i)=>`<div class="card raven-card"><div class="raven-head"><div class="raven-letter">${letter}</div><div><b>${en}</b><div class="muted">${kk} · ${max} балл</div></div></div><p class="muted">${hint}</p><textarea class="field" placeholder="Өз талдауыңызды жазыңыз..." oninput="state.ravens['${k}${i}']=this.value;save()">${esc(state.ravens[k+i]||'')}</textarea><div class="rubric"><span class="muted">Өзін-өзі бағалау</span><select onchange="setRavenRubric('${k}',${i},this.value)">${Array.from({length:max+1},(_,n)=>`<option value="${n}" ${Number(rub[i]||0)===n?'selected':''}>${n} / ${max}</option>`).join('')}</select></div></div>`).join('')}<div class="card"><div class="eyebrow">RAVEN · ӨЗІН-ӨЗІ БАҒАЛАУ</div><div class="stat-number" id="ravenTotal">${ravens.reduce((s,r,i)=>s+Number(rub[i]||0),0)} / 12</div><p class="muted">Автоматты AI бағалау жоқ. Баллды өзіңіз рубрика бойынша таңдайсыз.</p><button class="btn primary" onclick="save();toast('RAVEN талдауы сақталды')">Талдауды сақтау ✓</button></div>${footer()}`}
function setRavenRubric(k,i,v){state.ravenRubrics[k]??={};state.ravenRubrics[k][i]=Number(v);save();$('ravenTotal').textContent=ravens.reduce((s,_,j)=>s+Number(state.ravenRubrics[k][j]||0),0)+' / 12'}
function renderProgress(){let best=state.scores.filter(x=>x.type==='Тест').reduce((a,b)=>Math.max(a,Math.round(b.score/b.max*100)),0);$('view').innerHTML=`${heading('Менің нәтижем','Сабақтағы жетістіктеріңіз және сақталған жұмыстарыңыз. Мәліметтер тек осы браузерде сақталады.')}<div class="grid three"><div class="card"><div class="stat-label">ТЕОРИЯ</div><div class="stat-number">${pct()}%</div><div class="progress"><div style="width:${pct()}%"></div></div><p class="stat-note">${completed()} / 10 бөлім</p></div><div class="card"><div class="stat-label">ҮЗДІК ТЕСТ НӘТИЖЕСІ</div><div class="stat-number">${best}%</div><p class="stat-note">${state.scores.filter(x=>x.type==='Тест').length} әрекет</p></div><div class="card"><div class="stat-label">САҚТАЛҒАН ЖҰМЫСТАР</div><div class="stat-number">${Object.values(state.essays).filter(x=>x.trim()).length+Object.values(state.ravens).filter(x=>x.trim()).length}</div><p class="stat-note">Ой толғау және RAVEN жауаптары</p></div></div><div class="grid two" style="margin-top:20px"><div class="card"><h3>Бөлімдер бойынша прогресс</h3>${DATA.lessons.map(x=>`<div class="mini-stat"><span>${esc(x.title)}</span><span class="pill" style="background:${state.done.includes(x.id)?'#e8f5f1':'#f1f4f9'};color:${state.done.includes(x.id)?'#0b7b6b':'#7d8a9b'}">${state.done.includes(x.id)?'Аяқталды':'Оқылмаған'}</span></div>`).join('')}</div><div><div class="card"><h3>Соңғы нәтижелер</h3>${state.scores.length?state.scores.slice(-8).reverse().map(x=>`<div class="mini-stat"><span>${esc(x.type)} <small class="muted">· ${esc(x.date)}</small></span><b>${x.score}/${x.max}</b></div>`).join(''):'<div class="empty">Әзірге тест нәтижелері жоқ.</div>'}</div><div class="card" style="margin-top:18px"><h3>Келесі қадам</h3><p class="muted">${completed()<10?'Әлі оқылмаған бөлімдерді аяқтап, кейін тапсырмаларды орындаңыз.':'Барлық бөлім аяқталды. Тест пен тарихи талдауды қайталаңыз.'}</p><button class="btn primary" onclick="go('${completed()<10?'theory':'practice'}')">Жалғастыру →</button></div><div class="card" style="margin-top:18px"><h3>Деректерді басқару</h3><p class="muted">Барлық прогресс осы құрылғының браузерінде сақталады.</p><button class="btn outline" onclick="exportProgress()">Нәтижені экспорттау ↓</button><button class="btn outline" style="margin-top:10px;color:#c24141" onclick="resetProgress()">Прогресті өшіру</button></div></div></div>${footer()}`}
function exportProgress(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TarihHub_progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function resetProgress(){if(confirm('Барлық сақталған жауаптар мен прогресті өшіресіз бе?')){localStorage.removeItem(K);location.reload()}}
go('home');
</script></body></html>
